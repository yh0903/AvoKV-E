[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avokv-e"
version = "0.1.0"
description = "Payload-aware KV-cache eviction for long reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Han Yu"}]
keywords = ["kv-cache", "llm", "reasoning", "inference", "transformers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "transformers==5.8.0",
  "accelerate>=1.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
eval = [
  "latex2sympy2>=1.9.1",
  "regex>=2024.5.15",
  "sympy>=1.12",
]
data = ["datasets>=3.0"]
dev = [
  "latex2sympy2>=1.9.1",
  "regex>=2024.5.15",
  "sympy>=1.12",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.urls]
Paper = "https://arxiv.org/abs/2610.03007"
Repository = "https://github.com/yh0903/AvoKV-E"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
